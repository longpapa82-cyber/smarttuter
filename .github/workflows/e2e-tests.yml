name: E2E Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
          GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 30

  accessibility:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npx playwright test tests/e2e/accessibility.spec.ts --project=chromium
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 30

  performance:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run performance tests
        run: npx playwright test tests/e2e/performance.spec.ts --project=chromium --reporter=json
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: playwright-report/
          retention-days: 30

      - name: Parse and comment performance metrics
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));

            let comment = '## 📊 Performance Test Results\n\n';
            comment += '| Test | Status | Duration |\n';
            comment += '|------|--------|----------|\n';

            for (const suite of results.suites) {
              for (const spec of suite.specs) {
                const status = spec.ok ? '✅' : '❌';
                const duration = spec.tests[0]?.results[0]?.duration || 0;
                comment += `| ${spec.title} | ${status} | ${duration}ms |\n`;
              }
            }

            // Post comment to PR
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  test-summary:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [test, accessibility, performance]
    if: always()

    steps:
      - name: Test Summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let summary = '# 🧪 E2E Test Summary\n\n';

            // Get job statuses
            const jobs = context.payload.workflow_run?.jobs || [];

            const testStatus = '${{ needs.test.result }}';
            const a11yStatus = '${{ needs.accessibility.result }}';
            const perfStatus = '${{ needs.performance.result }}';

            summary += `## Test Results\n\n`;
            summary += `- **E2E Tests (3 browsers)**: ${testStatus === 'success' ? '✅ Passed' : '❌ Failed'}\n`;
            summary += `- **Accessibility Tests**: ${a11yStatus === 'success' ? '✅ Passed' : '❌ Failed'}\n`;
            summary += `- **Performance Tests**: ${perfStatus === 'success' ? '✅ Passed' : '⚠️ Check metrics'}\n`;

            summary += `\n## Coverage\n\n`;
            summary += `- **Total test files**: 21\n`;
            summary += `- **Total test lines**: 5,000+\n`;
            summary += `- **Browsers tested**: Chromium, Firefox, WebKit\n`;

            console.log(summary);

            // Post summary to PR if applicable
            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                issue_number: context.payload.pull_request.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }
